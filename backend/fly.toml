# fly.toml app configuration file generated for tecmipickup-app on 2026-08-31T23:45:27Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tecmipickup-app'
primary_region = 'lax'

[build]
  dockerfile = 'Dockerfile'

[env]
  MONGODB_DATABASE = 'tecmipickup'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '45s'
    method = 'GET'
    path = '/api/horarios'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
